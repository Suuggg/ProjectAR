```html
<script>
  AFRAME.registerComponent("ophelia-controller", {

    init() {

      this._onFound = this._onFound.bind(this);
      this._onLost  = this._onLost.bind(this);

      this.el.sceneEl.addEventListener("xrimagefound", this._onFound);
      this.el.sceneEl.addEventListener("xrimageupdated", this._onFound);
      this.el.sceneEl.addEventListener("xrimagelost", this._onLost);

      /* AUDIO */
      window.arSound = new Audio("assets/Ar-sound.mp3");
      window.arSound.loop = true;
      window.arSound.volume = 0;
      window.arSound.preload = "auto";
      window.arSound.playsInline = true;

      this._sound = window.arSound;
    },

    _fadeVol(target, ms) {

      const snd  = this._sound;
      const from = snd.volume;
      const diff = target - from;
      const steps = 30;

      let s = 0;

      clearInterval(this._fi);

      this._fi = setInterval(() => {

        s++;

        snd.volume = Math.min(
          1,
          Math.max(0, from + diff * s / steps)
        );

        if (s >= steps) {

          clearInterval(this._fi);

          if (target === 0) {
            snd.pause();
          }
        }

      }, ms / steps);
    },

    _onFound(evt) {

      if (evt.detail.name !== TARGET_NAME) return;

      /* VIDEO */
      const vid = document.querySelector("#ar-video");

      if (vid) {
        vid.play().catch(e => console.warn("video play:", e));
      }

      /* PLANE */
      const plane = document.querySelector("#video-plane");

      if (plane) {

        plane.setAttribute(
          "animation__op",
          "property: material.opacity; from: 0; to: 1; dur: 1200; easing: easeInQuad"
        );
      }

      /* AUDIO */
      if (this._sound.paused) {

        this._sound.currentTime = 0;

        this._sound.play()
          .then(() => {
            console.log("audio started");
          })
          .catch(err => {
            console.warn("audio blocked", err);
          });

        this._fadeVol(0.8, 2000);
      }

      document.getElementById("scan-prompt").classList.add("hidden");
      document.getElementById("note").classList.remove("hidden");

      clearTimeout(this._t);

      this._t = setTimeout(() => {

        const ni = document.getElementById("note-inner");

        if (ni) {

          ni.innerHTML = `
            <h3>— Elizabeth Siddall — 1851 —</h3>
            <p>
              Oil lamps extinguished.<br>
              Core temperature: <em>declining</em>.<br>
              Exposure duration: unknown.
            </p>
          `;
        }

      }, 6000);
    },

    _onLost(evt) {

      if (evt.detail.name !== TARGET_NAME) return;

      /* VIDEO */
      const vid = document.querySelector("#ar-video");

      if (vid) {
        vid.pause();
      }

      /* PLANE */
      const plane = document.querySelector("#video-plane");

      if (plane) {
        plane.setAttribute("material", "opacity", 0);
      }

      /* AUDIO */
      this._fadeVol(0, 800);

      /* UI */
      document.getElementById("scan-prompt").classList.remove("hidden");
      document.getElementById("note").classList.add("hidden");

      clearTimeout(this._t);
    },

    remove() {

      clearTimeout(this._t);
      clearInterval(this._fi);

      this.el.sceneEl.removeEventListener("xrimagefound", this._onFound);
      this.el.sceneEl.removeEventListener("xrimageupdated", this._onFound);
      this.el.sceneEl.removeEventListener("xrimagelost", this._onLost);
    }
  });
</script>
